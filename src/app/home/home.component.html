<!-- Navbar -->
<nav class="navbar">
  <div class="nav-logo">📚 BookShop</div>
  <div class="nav-links">
    <a routerLink="/">Home</a>
    <a routerLink="/about">About</a>
    <a routerLink="/contact">Contact</a>
    <a routerLink="/shop">🛒 Browse Books</a>

    <ng-container *ngIf="!isLoggedIn">
      <button class="nav-btn" (click)="openLogin()">🔐 Login</button>
    </ng-container>

    <ng-container *ngIf="isLoggedIn">
      <span style="color:rgba(255,255,255,0.8); font-size:14px;">
        👋 {{ currentUser?.name }}
      </span>
      <a *ngIf="isAdmin"    routerLink="/admin/books">📚 Manage Books</a>
      <a *ngIf="isAdmin"    routerLink="/admin/orders">📦 Orders</a>
      <a *ngIf="isCustomer" routerLink="/my-orders">📋 My Orders</a>
      <button class="nav-btn-danger" (click)="logout()">🚪 Logout</button>
    </ng-container>
  </div>
</nav>

<!-- Login Popup -->
<dx-popup
  [(visible)]="loginPopupVisible"
  title="Welcome to BookShop"
  [width]="440"
  height="auto"
  [showCloseButton]="true"
  [shading]="true"
  shadingColor="rgba(0,0,0,0.6)">

  <div *dxTemplate="let data of 'content'" style="padding:20px;">

    <dx-tabs [dataSource]="tabs" [(selectedIndex)]="activeTab" style="margin-bottom:20px;"></dx-tabs>

    <div *ngIf="errorMsg" style="
      background:rgba(239,68,68,0.1);
      border:1px solid rgba(239,68,68,0.3);
      border-radius:8px; padding:12px;
      color:#ef4444; font-size:14px; margin-bottom:16px;">
      ⚠️ {{ errorMsg }}
    </div>

    <!-- Admin Login -->
    <div *ngIf="activeTab === 0" style="display:flex; flex-direction:column; gap:14px;">
      <dx-text-box [(value)]="adminEmail"    label="Admin Email"    placeholder="admin@bookshop.com"></dx-text-box>
      <dx-text-box [(value)]="adminPassword" label="Password"       placeholder="••••••••" mode="password"></dx-text-box>
      <dx-button text="🔐 Login as Admin" type="success" stylingMode="contained" (onClick)="adminLogin()" style="height:42px;"></dx-button>
    </div>

    <!-- Customer Login -->
    <div *ngIf="activeTab === 1" style="display:flex; flex-direction:column; gap:14px;">
      <dx-text-box [(value)]="customerEmail"    label="Email"    placeholder="your@email.com"></dx-text-box>
      <dx-text-box [(value)]="customerPassword" label="Password" placeholder="••••••••" mode="password"></dx-text-box>
      <dx-button text="👤 Login as Customer" type="success" stylingMode="contained" (onClick)="customerLogin()" style="height:42px;"></dx-button>
      <p style="text-align:center; color:rgba(0,0,0,0.5); font-size:13px;">
        No account? <a (click)="activeTab=2" style="color:#667eea; cursor:pointer;">Register here</a>
      </p>
    </div>

    <!-- Register -->
    <div *ngIf="activeTab === 2" style="display:flex; flex-direction:column; gap:14px;">
      <dx-text-box [(value)]="regName"     label="Full Name"    placeholder="John Doe"></dx-text-box>
      <dx-text-box [(value)]="regEmail"    label="Email"        placeholder="your@email.com"></dx-text-box>
      <dx-text-box [(value)]="regPassword" label="Password"     placeholder="••••••••" mode="password"></dx-text-box>
      <dx-text-box [(value)]="regPhone"    label="Phone"        placeholder="+254 700 000 000"></dx-text-box>
      <dx-button text="📝 Create Account" type="success" stylingMode="contained" (onClick)="register()" style="height:42px;"></dx-button>
    </div>

  </div>
</dx-popup>
